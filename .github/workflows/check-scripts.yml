name: Check scripts

on:
  push:
  pull_request:

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: junior
    steps:
      - uses: actions/checkout@v4
      - name: Run random data script
        run: bash task-1-script/random-data.sh
      - name: Run service script
        run: bash task-2-configuration/show-service.sh
